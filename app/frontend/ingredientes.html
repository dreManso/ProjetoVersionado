<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurante — Ingredientes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>body { background: #f8f9fa; }</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/index.html"><i class="bi bi-shop"></i> Restaurante</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/index.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" href="/ingredientes.html"><i class="bi bi-basket2"></i> Ingredientes</a></li>
        <li class="nav-item"><a class="nav-link" href="/preparacoes.html"><i class="bi bi-journal-richtext"></i> Preparações</a></li>
        <li class="nav-item"><a class="nav-link" href="/vendas.html"><i class="bi bi-cart3"></i> Vendas</a></li>
        <li class="nav-item"><a class="nav-link" href="/estoque.html"><i class="bi bi-box-seam"></i> Estoque</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0"><i class="bi bi-basket2"></i> Ingredientes</h4>
    <button class="btn btn-primary" onclick="openCreate()"><i class="bi bi-plus-lg"></i> Novo Ingrediente</button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>Nome</th><th>Unidade</th><th>Custo/unid.</th>
              <th>Estoque atual</th><th>Estoque mínimo</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Criar / Editar -->
<div class="modal fade" id="modalIng" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Novo Ingrediente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="ing-id">
        <div class="mb-3">
          <label class="form-label fw-semibold">Nome *</label>
          <input type="text" class="form-control" id="ing-name" placeholder="ex: Tomate">
        </div>
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label fw-semibold">Unidade *</label>
            <select class="form-select" id="ing-unit">
              <option value="kg">kg</option>
              <option value="g">g</option>
              <option value="L">L</option>
              <option value="mL">mL</option>
              <option value="un">un</option>
              <option value="dose">dose</option>
              <option value="cx">cx</option>
              <option value="pct">pct</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label fw-semibold">Custo por unidade (R$) *</label>
            <input type="number" class="form-control" id="ing-cost" min="0" step="0.01" placeholder="0,00">
          </div>
        </div>
        <div class="row g-2 mt-1">
          <div class="col-6">
            <label class="form-label fw-semibold">Estoque inicial</label>
            <input type="number" class="form-control" id="ing-stock" min="0" step="0.001" value="0">
          </div>
          <div class="col-6">
            <label class="form-label fw-semibold">Estoque mínimo</label>
            <input type="number" class="form-control" id="ing-min" min="0" step="0.001" value="0">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="save()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Entrada de estoque -->
<div class="modal fade" id="modalStock" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Entrada de Estoque</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="stock-ing-id">
        <p class="fw-semibold mb-2" id="stock-ing-name"></p>
        <div class="mb-3">
          <label class="form-label">Quantidade a adicionar</label>
          <input type="number" class="form-control" id="stock-qty" min="0.001" step="0.001" placeholder="0">
        </div>
        <div class="mb-3">
          <label class="form-label">Observação</label>
          <input type="text" class="form-control" id="stock-notes" placeholder="opcional">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-success" onclick="saveStock()"><i class="bi bi-plus-lg"></i> Adicionar</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
let ingredients = [];
const modal = () => bootstrap.Modal.getOrCreateInstance(document.getElementById('modalIng'));
const modalStock = () => bootstrap.Modal.getOrCreateInstance(document.getElementById('modalStock'));

async function load() {
    ingredients = await api.getIngredients();
    render();
}

function render() {
    const tbody = document.getElementById('tbody');
    if (!ingredients.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Nenhum ingrediente cadastrado</td></tr>';
        return;
    }
    tbody.innerHTML = ingredients.map(i => `
        <tr>
          <td class="fw-semibold">${i.name}</td>
          <td>${i.unit}</td>
          <td>${brl(i.cost_per_unit)}</td>
          <td>${num(i.stock_quantity)} ${i.unit}</td>
          <td>${num(i.min_stock)} ${i.unit}</td>
          <td>${i.is_low_stock
              ? '<span class="badge bg-danger"><i class="bi bi-exclamation-triangle"></i> Baixo</span>'
              : '<span class="badge bg-success">OK</span>'}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-success me-1" title="Entrada de estoque" onclick="openStock(${i.id})">
              <i class="bi bi-plus-circle"></i>
            </button>
            <button class="btn btn-sm btn-outline-primary me-1" title="Editar" onclick="openEdit(${i.id})">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" title="Excluir" onclick="remove(${i.id}, '${i.name}')">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>`).join('');
}

function openCreate() {
    document.getElementById('modalTitle').textContent = 'Novo Ingrediente';
    document.getElementById('ing-id').value = '';
    document.getElementById('ing-name').value = '';
    document.getElementById('ing-unit').value = 'kg';
    document.getElementById('ing-cost').value = '';
    document.getElementById('ing-stock').value = '0';
    document.getElementById('ing-min').value = '0';
    modal().show();
}

function openEdit(id) {
    const ing = ingredients.find(i => i.id === id);
    document.getElementById('modalTitle').textContent = 'Editar Ingrediente';
    document.getElementById('ing-id').value = id;
    document.getElementById('ing-name').value = ing.name;
    document.getElementById('ing-unit').value = ing.unit;
    document.getElementById('ing-cost').value = ing.cost_per_unit;
    document.getElementById('ing-stock').value = ing.stock_quantity;
    document.getElementById('ing-min').value = ing.min_stock;
    modal().show();
}

async function save() {
    const id = document.getElementById('ing-id').value;
    const data = {
        name: document.getElementById('ing-name').value.trim(),
        unit: document.getElementById('ing-unit').value,
        cost_per_unit: parseFloat(document.getElementById('ing-cost').value),
        min_stock: parseFloat(document.getElementById('ing-min').value) || 0,
    };
    if (!data.name || isNaN(data.cost_per_unit)) {
        showToast('Preencha nome e custo', 'error'); return;
    }
    try {
        if (id) {
            await api.updateIngredient(id, data);
            showToast('Ingrediente atualizado');
        } else {
            data.stock_quantity = parseFloat(document.getElementById('ing-stock').value) || 0;
            await api.createIngredient(data);
            showToast('Ingrediente criado');
        }
        modal().hide();
        load();
    } catch(e) { showToast(e.message, 'error'); }
}

function openStock(id) {
    const ing = ingredients.find(i => i.id === id);
    document.getElementById('stock-ing-id').value = id;
    document.getElementById('stock-ing-name').textContent = ing.name + ' — atual: ' + num(ing.stock_quantity) + ' ' + ing.unit;
    document.getElementById('stock-qty').value = '';
    document.getElementById('stock-notes').value = '';
    modalStock().show();
}

async function saveStock() {
    const id = document.getElementById('stock-ing-id').value;
    const qty = parseFloat(document.getElementById('stock-qty').value);
    if (!qty || qty <= 0) { showToast('Informe uma quantidade válida', 'error'); return; }
    try {
        await api.addStock(id, { ingredient_id: parseInt(id), quantity: qty, notes: document.getElementById('stock-notes').value });
        showToast('Estoque atualizado');
        modalStock().hide();
        load();
    } catch(e) { showToast(e.message, 'error'); }
}

async function remove(id, name) {
    if (!confirm(`Excluir "${name}"?`)) return;
    try {
        await api.deleteIngredient(id);
        showToast('Ingrediente excluído');
        load();
    } catch(e) { showToast(e.message, 'error'); }
}

load();
</script>
</body>
</html>
