<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurante — Vendas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>body { background: #f8f9fa; }</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/index.html"><i class="bi bi-shop"></i> Restaurante</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/index.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/ingredientes.html"><i class="bi bi-basket2"></i> Ingredientes</a></li>
        <li class="nav-item"><a class="nav-link" href="/preparacoes.html"><i class="bi bi-journal-richtext"></i> Preparações</a></li>
        <li class="nav-item"><a class="nav-link active" href="/vendas.html"><i class="bi bi-cart3"></i> Vendas</a></li>
        <li class="nav-item"><a class="nav-link" href="/estoque.html"><i class="bi bi-box-seam"></i> Estoque</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h4 class="fw-bold mb-4"><i class="bi bi-cart3"></i> Registrar Venda</h4>

  <div class="row g-4">
    <!-- Formulário -->
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-header fw-semibold">Nova Venda</div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Preparação *</label>
            <select class="form-select" id="sale-dish" onchange="onDishChange()">
              <option value="">— Selecione —</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Quantidade *</label>
            <input type="number" class="form-control" id="sale-qty" min="0.5" step="0.5" value="1" oninput="updateTotal()">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Preço unitário (R$) *</label>
            <input type="number" class="form-control" id="sale-price" min="0" step="0.01" oninput="updateTotal()">
          </div>
          <div class="card bg-light mb-3">
            <div class="card-body py-2 text-center">
              <div class="small text-muted">Total da venda</div>
              <div class="fs-4 fw-bold text-success" id="sale-total">R$ 0,00</div>
            </div>
          </div>
          <div id="dish-info" class="alert alert-info small d-none"></div>
          <button class="btn btn-success w-100" onclick="registerSale()">
            <i class="bi bi-check-circle"></i> Registrar Venda
          </button>
          <div class="form-text text-muted mt-2">
            <i class="bi bi-info-circle"></i> O estoque de ingredientes será deduzido automaticamente.
          </div>
        </div>
      </div>
    </div>

    <!-- Histórico -->
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header fw-semibold">Histórico de Vendas</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr><th>Data/Hora</th><th>Preparação</th><th>Qtd</th><th>Preço Unit.</th><th>Total</th></tr>
              </thead>
              <tbody id="sales-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
let dishes = [];

async function load() {
    [dishes] = await Promise.all([api.getDishes()]);
    const sel = document.getElementById('sale-dish');
    const sellable = dishes.filter(d => d.is_sellable);
    sel.innerHTML = '<option value="">— Selecione —</option>' +
        sellable.map(d => `<option value="${d.id}" data-price="${d.selling_price || ''}">${d.name}</option>`).join('');
    loadSales();
}

async function loadSales() {
    const sales = await api.getSales();
    const tbody = document.getElementById('sales-body');
    if (!sales.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">Nenhuma venda registrada</td></tr>';
        return;
    }
    tbody.innerHTML = sales.map(s => `
        <tr>
          <td class="small">${new Date(s.date).toLocaleString('pt-BR')}</td>
          <td>${s.dish_name}</td>
          <td>${num(s.quantity_sold, 1)}</td>
          <td>${brl(s.unit_price)}</td>
          <td class="fw-bold text-success">${brl(s.total)}</td>
        </tr>`).join('');
}

function onDishChange() {
    const sel = document.getElementById('sale-dish');
    const opt = sel.options[sel.selectedIndex];
    const price = opt.dataset.price;
    if (price) {
        document.getElementById('sale-price').value = parseFloat(price).toFixed(2);
    }
    // mostrar info do prato
    const dish = dishes.find(d => d.id === parseInt(sel.value));
    const info = document.getElementById('dish-info');
    if (dish) {
        const parts = [];
        if (dish.total_cost) parts.push(`Custo: ${brl(dish.total_cost)}`);
        if (dish.margin_percent != null) parts.push(`Margem: ${pct(dish.margin_percent)}`);
        if (!dish.is_cost_complete) parts.push('⚠ Custo incompleto');
        info.textContent = parts.join(' | ');
        info.classList.remove('d-none');
    } else {
        info.classList.add('d-none');
    }
    updateTotal();
}

function updateTotal() {
    const qty = parseFloat(document.getElementById('sale-qty').value) || 0;
    const price = parseFloat(document.getElementById('sale-price').value) || 0;
    document.getElementById('sale-total').textContent = brl(qty * price);
}

async function registerSale() {
    const dishId = parseInt(document.getElementById('sale-dish').value);
    const qty = parseFloat(document.getElementById('sale-qty').value);
    const price = parseFloat(document.getElementById('sale-price').value);
    if (!dishId) { showToast('Selecione a preparação', 'error'); return; }
    if (!qty || qty <= 0) { showToast('Informe a quantidade', 'error'); return; }
    if (!price || price <= 0) { showToast('Informe o preço', 'error'); return; }
    try {
        await api.registerSale({ dish_id: dishId, quantity_sold: qty, unit_price: price });
        showToast('Venda registrada! Estoque atualizado.');
        document.getElementById('sale-dish').value = '';
        document.getElementById('sale-qty').value = '1';
        document.getElementById('sale-price').value = '';
        document.getElementById('sale-total').textContent = 'R$ 0,00';
        document.getElementById('dish-info').classList.add('d-none');
        loadSales();
    } catch(e) { showToast(e.message, 'error'); }
}

load();
</script>
</body>
</html>
