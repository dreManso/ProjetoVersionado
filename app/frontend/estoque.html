<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cozinha — Estoque</title>
<link href="/vendor/bootstrap.min.css" rel="stylesheet">
<link href="/vendor/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h4 class="fw-bold mb-0"><i class="bi bi-box-seam"></i> Estoque</h4>
    <div class="d-flex gap-2">
      <select class="form-select form-select-sm" id="f-kind" style="width:auto">
        <option value="">Todos</option><option value="compra">Comprados</option><option value="producao">Produzidos</option>
      </select>
      <input class="form-control form-control-sm" id="f-text" placeholder="Filtrar..." style="max-width:180px">
    </div>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-dark"><tr><th>Item</th><th>Tipo</th><th class="num">Estoque</th><th class="num">Segurança</th><th class="num">Valor</th><th>Situação</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-header fw-semibold">Últimas movimentações</div>
    <div class="table-responsive" style="max-height:480px">
      <table class="table table-sm table-hover mb-0">
        <thead class="table-light"><tr><th>Data</th><th>Item</th><th>Tipo</th><th class="num">Qtd</th><th class="num">Custo unit.</th><th>Obs.</th></tr></thead>
        <tbody id="mov"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal fade" id="mBuy" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Entrada de compra</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <p class="fw-semibold" id="b-name"></p>
      <div class="row g-2 mb-2">
        <div class="col-6"><label class="form-label">Quantidade comprada *</label>
          <div class="input-group"><input class="form-control" id="b-qty" inputmode="decimal"><select class="form-select" id="b-unit" style="max-width:130px"></select></div>
          <div class="help" id="b-pack"></div></div>
        <div class="col-6"><label class="form-label">Valor total pago (R$) *</label>
          <input class="form-control" id="b-total" inputmode="decimal"></div>
      </div>
      <div class="row g-2">
        <div class="col-6"><label class="form-label">Data</label><input type="date" class="form-control" id="b-day"></div>
        <div class="col-6"><label class="form-label">Obs. / NF</label><input class="form-control" id="b-notes"></div>
      </div>
      <div class="help mt-2" id="b-preview"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      <button class="btn btn-success" onclick="saveBuy()">Dar entrada</button></div>
  </div></div>
</div>

<div class="modal fade" id="mCount" tabindex="-1">
  <div class="modal-dialog modal-sm"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Contagem</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <p class="fw-semibold mb-1" id="c-name"></p>
      <p class="help" id="c-system"></p>
      <label class="form-label">Quantidade contada *</label>
      <div class="input-group mb-2"><input class="form-control" id="c-qty" inputmode="decimal"><span class="input-group-text" id="c-unit"></span></div>
      <input class="form-control" id="c-notes" placeholder="Motivo (opcional)">
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      <button class="btn btn-warning" onclick="saveCount()">Acertar estoque</button></div>
  </div></div>
</div>

<div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index:2000"></div>
<script src="/vendor/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
renderNav('estoque');
const $ = id => document.getElementById(id);
let items = [], sel = null;
$('f-kind').onchange = render; $('f-text').oninput = render;
['b-qty', 'b-total'].forEach(id => $(id).oninput = previewBuy);
$('b-unit').onchange = previewBuy;

async function load() {
  items = (await api.items()).filter(i => i.kind !== 'venda' && i.active);
  render(); loadMov();
}

function render() {
  const k = $('f-kind').value, f = norm($('f-text').value);
  const rows = items.filter(i => (!k || i.kind === k) && (!f || norm(i.name).includes(f)))
    .sort((a, b) => ((b.stock < 0) - (a.stock < 0)) || a.name.localeCompare(b.name));
  $('tbody').innerHTML = rows.length ? rows.map(i => {
    const cost = i.avg_cost || i.unit_cost || 0;
    const st = i.stock < -1e-9 ? '<span class="badge bg-danger">Negativo</span>'
      : i.stock < i.min_stock ? '<span class="badge bg-warning text-dark">Abaixo da segurança</span>'
      : '<span class="badge bg-success">OK</span>';
    return `<tr><td class="fw-semibold">${esc(i.name)}</td><td><span class="badge kind-${i.kind}">${KIND_LABEL[i.kind]}</span></td>
      <td class="num ${i.stock < 0 ? 'text-danger fw-bold' : ''}">${qty(i.stock, i.unit)}</td><td class="num">${i.min_stock ? qty(i.min_stock, i.unit) : '—'}</td>
      <td class="num">${brl(Math.max(i.stock, 0) * cost)}</td><td>${st}</td>
      <td class="text-end text-nowrap">
        <button class="btn btn-sm btn-outline-success" onclick="openBuy(${i.id})" title="Entrada de compra"><i class="bi bi-cart-plus"></i></button>
        <button class="btn btn-sm btn-outline-warning" onclick="openCount(${i.id})" title="Contagem"><i class="bi bi-123"></i></button></td></tr>`;
  }).join('') : '<tr><td colspan="7" class="text-center text-muted py-4">Nenhum item</td></tr>';
}

async function loadMov() {
  const rows = await api.movements('?limit=150');
  $('mov').innerHTML = rows.length ? rows.map(m => {
    const [label, color] = MOV_LABEL[m.type] || [m.type, 'secondary'];
    return `<tr><td class="small text-muted">${dt(m.date)}</td><td>${esc(m.item_name)}</td><td><span class="badge bg-${color}">${label}</span></td>
      <td class="num ${m.quantity < 0 ? 'text-danger' : 'text-success'}">${m.quantity > 0 ? '+' : ''}${qty(m.quantity, m.unit)}</td>
      <td class="num">${brl(m.unit_cost)}</td><td class="small text-muted">${esc(m.notes || '')}</td></tr>`;
  }).join('') : '<tr><td colspan="6" class="text-center text-muted py-3">Nenhuma movimentação</td></tr>';
}

function openBuy(id) {
  sel = items.find(i => i.id === id);
  const label = sel.pack_label || 'embalagem';
  // opções: embalagem (se cadastrada) + unidades compatíveis (g/kg, mL/L, un)
  $('b-unit').innerHTML = (sel.pack_size ? `<option value="pack">${esc(label)}</option>` : '') +
    (UNIT_OPTIONS[sel.unit] || [sel.unit]).map(u => `<option value="${u}">${u}</option>`).join('');
  $('b-name').textContent = sel.name;
  $('b-qty').value = sel.pack_size ? 1 : ''; $('b-total').value = ''; $('b-notes').value = ''; $('b-day').value = todayISO();
  $('b-pack').textContent = sel.pack_size
    ? `1 ${label} = ${qty(convertQty(sel.pack_size, sel.unit, friendlyUnit(sel.pack_size, sel.unit)), friendlyUnit(sel.pack_size, sel.unit))}`
    : 'Peso bruto, como chegou';
  previewBuy();
  bootstrap.Modal.getOrCreateInstance($('mBuy')).show();
}
// quantidade digitada → unidade de estoque do item
function buyQty() {
  const q = parseNum($('b-qty').value), u = $('b-unit').value;
  if (!(q > 0)) return null;
  return u === 'pack' ? q * sel.pack_size : convertQty(q, u, sel.unit);
}
function previewBuy() {
  const q = buyQty(), t = parseNum($('b-total').value);
  if (!q || t == null) { $('b-preview').textContent = ''; return; }
  let txt = `= ${qty(q, sel.unit)} a ${brl(t / q)} por ${sel.unit}`;
  if (sel.pack_size) txt += ` (${brl(t / q * sel.pack_size)} por ${sel.pack_label || 'embalagem'})`;
  if (sel.avg_cost) txt += ` · média atual ${brl(sel.avg_cost)}/${sel.unit}`;
  $('b-preview').textContent = txt;
}
async function saveBuy() {
  const q = buyQty(), t = parseNum($('b-total').value);
  if (!(q > 0) || t == null) return toast('Informe quantidade e valor', 'error');
  await safe(async () => {
    const r = await api.purchase({ item_id: sel.id, quantity: q, total_price: t, day: $('b-day').value || null, notes: $('b-notes').value.trim() || null });
    toast(`Entrada registrada. Novo custo médio: ${brl(r.avg_cost)}/${sel.unit}`);
    bootstrap.Modal.getOrCreateInstance($('mBuy')).hide(); load();
  });
}

function openCount(id) {
  sel = items.find(i => i.id === id);
  $('c-name').textContent = sel.name; $('c-unit').textContent = sel.unit;
  $('c-system').textContent = `No sistema: ${qty(sel.stock, sel.unit)}`;
  $('c-qty').value = ''; $('c-notes').value = '';
  bootstrap.Modal.getOrCreateInstance($('mCount')).show();
}
async function saveCount() {
  const q = parseNum($('c-qty').value);
  if (q == null || q < 0) return toast('Informe a quantidade contada', 'error');
  await safe(async () => {
    const r = await api.adjust({ item_id: sel.id, counted_quantity: q, notes: $('c-notes').value.trim() || null });
    toast(r.difference ? `Diferença de ${qty(r.difference, sel.unit)} (${brl(r.difference_value)})` : 'Estoque confere', r.difference < 0 ? 'warn' : 'success');
    bootstrap.Modal.getOrCreateInstance($('mCount')).hide(); load();
  });
}

load();
</script>
</body>
</html>
